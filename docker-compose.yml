# =============================================================================
# Outreach Engine — production stack
#
#   db      · PostgreSQL 16, named volume, nightly dump to ./backups
#   migrate · runs migrations once, then exits; web and worker wait for it
#   web     · Next.js
#   worker  · same image, background jobs
#   caddy   · reverse proxy with automatic TLS
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f worker
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-outreach}
      # Postgres tuning for a 2GB droplet.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not published to the host — only the app containers reach it.
    expose:
      - '5432'
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
      - -c
      - work_mem=8MB

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outreach}
    command: ['npx', 'tsx', 'src/db/migrate.ts']

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outreach}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outreach}
    command: ['npm', 'run', 'worker']
    # Give in-flight jobs time to finish before the container is killed.
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}

  # Nightly pg_dump into ./backups, keeping 14 days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c '
        while true; do
          sleep 86400;
          pg_dump -h db -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach} -Fc \
            -f /backups/outreach-$$(date +%Y%m%d-%H%M).dump \
            && echo "backup ok $$(date -Iseconds)" \
            || echo "backup FAILED $$(date -Iseconds)";
          find /backups -name "outreach-*.dump" -mtime +14 -delete;
        done
      '

volumes:
  pgdata:
  caddy_data:
  caddy_config:
